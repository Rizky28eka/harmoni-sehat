# This workflow is tailored for Flutter projects.
name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel any in-progress runs of the same workflow for a given PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test Flutter App
    runs-on: ubuntu-latest

    # Set the default working directory for all steps.
    defaults:
      run:
        working-directory: ./harmoni_sehat_frontend

    steps:
      # 1. Check out the repository so the workflow can access it.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Flutter SDK, including caching for dependencies.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3. Install Flutter dependencies.
      - name: Install dependencies
        run: flutter pub get

      # 4. Check for any formatting issues.
      - name: Verify formatting
        run: flutter format --output=none --set-exit-if-changed .

      # 5. Analyze the project's Dart code for errors and warnings.
      - name: Analyze project source
        run: flutter analyze

      # 6. Run widget tests.
      - name: Run tests
        run: flutter test