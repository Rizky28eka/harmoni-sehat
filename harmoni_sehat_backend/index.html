<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); max-width: 600px; margin: auto; }
        h2 { text-align: center; color: #333; }
        form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input[type="text"], input[type="email"], input[type="password"], select { padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .response { background-color: #e9e9e9; padding: 15px; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Backend API Test</h2>

        <h3>Register User</h3>
        <form id="registerForm">
            <input type="text" id="registerName" placeholder="Name" required>
            <input type="email" id="registerEmail" placeholder="Email" required>
            <input type="password" id="registerPassword" placeholder="Password" required>
            <select id="registerRole">
                <option value="pasien">Pasien</option>
                <option value="dokter">Dokter</option>
                <option value="farmasi">Farmasi</option>
                <option value="admin">Admin</option>
            </select>
            <!-- Role-specific fields (simplified for testing) -->
            <input type="text" id="registerNik" placeholder="NIK (Pasien only)">
            <input type="text" id="registerTanggalLahir" placeholder="Tanggal Lahir YYYY-MM-DD (Pasien only)">
            <select id="registerJenisKelamin">
                <option value="">Jenis Kelamin (Pasien only)</option>
                <option value="Laki-laki">Laki-laki</option>
                <option value="Perempuan">Perempuan</option>
            </select>
            <input type="text" id="registerAlamat" placeholder="Alamat (Pasien only)">
            <input type="text" id="registerNoTelepon" placeholder="No Telepon (Pasien only)">
            <input type="text" id="registerNomorStr" placeholder="Nomor STR (Dokter only)">
            <input type="text" id="registerSpesialisasiId" placeholder="Spesialisasi ID (Dokter only)">
            <input type="number" id="registerBiayaKonsultasi" placeholder="Biaya Konsultasi (Dokter only)">
            <input type="text" id="registerNomorSipa" placeholder="Nomor SIPA (Farmasi only)">
            <button type="submit">Register</button>
        </form>
        <div id="registerResponse" class="response"></div>

        <h3>Login User</h3>
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div id="loginResponse" class="response"></div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8000/api'; // Sesuaikan dengan port backend Anda

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const role = document.getElementById('registerRole').value;

            const data = { name, email, password, role };

            // Add role-specific data
            if (role === 'pasien') {
                data.nik = document.getElementById('registerNik').value;
                data.tanggal_lahir = document.getElementById('registerTanggalLahir').value;
                data.jenis_kelamin = document.getElementById('registerJenisKelamin').value;
                data.alamat = document.getElementById('registerAlamat').value;
                data.no_telepon = document.getElementById('registerNoTelepon').value;
            } else if (role === 'dokter') {
                data.nomor_str = document.getElementById('registerNomorStr').value;
                data.spesialisasi_id = document.getElementById('registerSpesialisasiId').value;
                data.biaya_konsultasi = parseFloat(document.getElementById('registerBiayaKonsultasi').value);
            } else if (role === 'farmasi') {
                data.nomor_sipa = document.getElementById('registerNomorSipa').value;
            }

            try {
                const response = await fetch(`${BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data),
                });
                const result = await response.json();
                if (response.ok) {
                    document.getElementById('registerResponse').className = 'response success';
                    document.getElementById('registerResponse').innerText = JSON.stringify(result, null, 2);
                } else {
                    document.getElementById('registerResponse').className = 'response error';
                    document.getElementById('registerResponse').innerText = `Error: ${result.message || response.statusText}`;
                }
            } catch (error) {
                document.getElementById('registerResponse').className = 'response error';
                document.getElementById('registerResponse').innerText = `Network Error: ${error.message}`;
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });
                const result = await response.json();
                if (response.ok) {
                    document.getElementById('loginResponse').className = 'response success';
                    document.getElementById('loginResponse').innerText = JSON.stringify(result, null, 2);
                } else {
                    document.getElementById('loginResponse').className = 'response error';
                    document.getElementById('loginResponse').innerText = `Error: ${result.message || response.statusText}`;
                }
            } catch (error) {
                document.getElementById('loginResponse').className = 'response error';
                document.getElementById('loginResponse').innerText = `Network Error: ${error.message}`;
            }
        });
    </script>
</body>
</html>
